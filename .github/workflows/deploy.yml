name: Build & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: SSH vorbereiten
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Deployen (tar über SSH, mit Bereinigung)
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
          TARGET: ${{ secrets.DEPLOY_PATH }}
        run: |
          # Sicherheitschecks
          test -n "$TARGET"
          test -f dist/index.html

          # 1. Neuen Build in Staging hochladen (Live-Seite bleibt unberührt)
          tar -czf - -C dist . | ssh "$USER@$HOST" \
            "rm -rf '$TARGET.staging' && mkdir -p '$TARGET.staging' && tar -xzf - -C '$TARGET.staging'"

          # 2. Altes Webroot leeren, Staging einspielen, Staging löschen
          ssh "$USER@$HOST" "set -e
            mkdir -p '$TARGET'
            find '$TARGET' -mindepth 1 -maxdepth 1 ! -name .well-known ! -name cgi-bin -exec rm -rf {} +
            cp -a '$TARGET.staging/.' '$TARGET/'
            rm -rf '$TARGET.staging'"
